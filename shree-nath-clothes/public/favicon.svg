<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2c6"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3d0712"/>
      <stop offset="100%" stop-color="#160104"/>
    </radialGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="32" cy="32" r="30" fill="url(#aura)" stroke="url(#goldGrad)" stroke-width="2"/>
  <!-- Shrinathji Tilak U Shape -->
  <path d="M22 16 C22 36, 42 36, 42 16" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
